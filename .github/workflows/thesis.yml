name: Thesis PDF

on:
  push:
    paths:
      - "thesis/**"
      - ".github/workflows/thesis.yml"
  pull_request:
    paths:
      - "thesis/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: thesis
          latexmk_use_lualatex: false
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-pdf
          path: thesis/main.pdf
